name: Validate Kasher POS source
on:
  push:
    branches: [feature/import-kasher-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-backup.txt
      - run: python tools/verify_schema.py
      - run: python -m unittest discover -s tools/tests -v

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: server
      - run: dart analyze
        working-directory: server
      - run: dart test
        working-directory: server

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native scaffolds
        working-directory: app
        run: |
          flutter create --platforms=android,windows --project-name=kasher_app .
          # Flutter's generated template test targets MyApp, not KasherApp.
          rm -f test/widget_test.dart
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app

  android-build:
    runs-on: ubuntu-latest
    needs: [server, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android native scaffold
        working-directory: app
        run: flutter create --project-name kasher_app --platforms=android .
      - name: Build Android development APK
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Kasher-Android-development
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-build:
    runs-on: windows-latest
    needs: [server, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows Flutter UI
        shell: pwsh
        working-directory: app
        run: |
          flutter create --project-name kasher_app --platforms=windows .
          flutter pub get
          flutter build windows --release
      - uses: dart-lang/setup-dart@v1
      - name: Build Windows local server
        shell: pwsh
        working-directory: server
        run: |
          dart pub get
          dart compile exe bin/kasher_server.dart -o ../app/build/windows/x64/runner/Release/kasher_server.exe
      - name: Package Windows development binaries
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath Kasher-Windows-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kasher-Windows-development
          path: Kasher-Windows-development.zip
          if-no-files-found: error
          retention-days: 14
