name: Validate Kasher POS source
on:
  push:
    branches: [feature/import-kasher-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-backup.txt
      - run: python tools/verify_schema.py
      - run: python -m unittest discover -s tools/tests -v

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: server
      - run: dart analyze
        working-directory: server
      - run: dart test
        working-directory: server

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native scaffolds
        working-directory: app
        run: |
          flutter create --platforms=android,windows --project-name=kasher_app .
          # Flutter's generated template test targets MyApp, not KasherApp.
          rm -f test/widget_test.dart
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app
